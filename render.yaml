services:
  - type: web
    name: neargather-web
    runtime: node
    region: oregon
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @neargather/web build
    startCommand: pnpm --filter @neargather/web start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: neargather-postgres
          property: connectionString
      - key: APP_BASE_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CAPABILITY_HMAC_KEY_V1
        sync: false

  - type: worker
    name: neargather-worker
    runtime: node
    region: oregon
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @neargather/worker build
    startCommand: pnpm --filter @neargather/worker start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: neargather-postgres
          property: connectionString
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_MESSAGING_SERVICE_SID
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_QUARANTINE_BUCKET
        sync: false
      - key: S3_MEDIA_BUCKET
        sync: false
      - key: CAPABILITY_HMAC_KEY_V1
        sync: false

databases:
  - name: neargather-postgres
    databaseName: neargather
    user: neargather
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "18"
